name: Build Android Swipe APK

on:
  push:
    branches:
      - apk-build-android-swipe-automator
  pull_request:
    branches:
      - claude/mcp-tw0s6e
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and validate source bundle
        shell: bash
        run: |
          cat .apk-build/part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/android-swipe-automator-source.zip
          unzip -t /tmp/android-swipe-automator-source.zip
          unzip -q /tmp/android-swipe-automator-source.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: gradle -p android-swipe-automator :app:assembleDebug --stacktrace

      - name: Verify APK exists
        shell: bash
        run: |
          test -f android-swipe-automator/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-swipe-automator/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroidSwipeAutomator-debug-apk
          path: android-swipe-automator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
