[build]
builder = "RAILPACK"
buildCommand = "python -m pip install -r requirements.txt && python build_runtime.py && python -m pip install --no-deps ."

[deploy]
startCommand = "python -m entity0.server"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
